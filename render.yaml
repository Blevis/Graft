# Render Blueprint: one Docker web service + one managed Postgres.
# Dashboard → New → Blueprint → pick this repo. GROQ_API_KEY is prompted for (sync: false).
databases:
  - name: graft-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: graft
    user: graft

services:
  - type: web
    name: graft
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: graft-db
          property: connectionString
      - key: AUTH_MODE
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: AS_OF_DATE
        value: "2026-10-14"
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
