# Render Blueprint: the HOSTED DEMO profile. One Docker web service + one managed Postgres, fictional data only.
# AI is disabled here (no model server; recorded examples only). Real employee data belongs on the private
# deployment described in docs/deployment.md, never on this profile.
databases:
  - name: graft-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: graft
    user: graft

services:
  - type: web
    name: graft
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: graft-db
          property: connectionString
      - key: AUTH_MODE
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: AS_OF_DATE
        value: "2026-10-14"
      - key: SESSION_SECRET
        generateValue: true
      - key: OLLAMA_BASE_URL
        value: ""
      - key: FORWARDED_ALLOW_IPS
        value: "*"
