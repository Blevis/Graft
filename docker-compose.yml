# Two profiles from one file.
#
#   docker compose up                                  demo: fictional data, AI via recorded examples only
#   docker compose --profile private up -d            private: OIDC, real clock, local Ollama, no internet for
#                                                      the model or the database (internal network)
#   docker compose --profile provision run --rm ollama-pull    one-time model download (the ONLY step with egress)
#
# See docs/deployment.md for secrets, model pinning, backups and the verification gates.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: graft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graft}
      POSTGRES_DB: graft
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graft -d graft"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- demo profile (default) ----
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://graft:${POSTGRES_PASSWORD:-graft}@db:5432/graft
      AUTH_MODE: demo
      DEMO_MODE: "true"
      OLLAMA_BASE_URL: ""          # no model in the demo profile: recorded examples, Ask/agent unavailable
    networks: [private, edge]
    depends_on:
      db:
        condition: service_healthy

  # ---- private profile ----
  ollama:
    profiles: ["private", "provision"]
    image: ollama/ollama:${OLLAMA_VERSION:-set-OLLAMA_VERSION-in-env}
    environment:
      OLLAMA_NO_CLOUD: "1"          # cloud models and cloud features disabled
      OLLAMA_HOST: 0.0.0.0:11434    # reachable on the private network only; no port is published
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    networks: [private]

  ollama-pull:
    profiles: ["provision"]
    image: ollama/ollama:${OLLAMA_VERSION:-set-OLLAMA_VERSION-in-env}
    entrypoint: ["sh", "-c", "ollama serve & sleep 3 && ollama pull ${LLM_MODEL:-qwen3:8b} && ollama list"]
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    networks: [egress]

  app-private:
    profiles: ["private"]
    build: .
    ports:
      - "127.0.0.1:8000:8000"       # put a TLS-terminating reverse proxy in front; see docs/deployment.md
    env_file:
      - path: .env.private
        required: true
    environment:
      DATABASE_URL: postgresql://graft:${POSTGRES_PASSWORD:-graft}@db:5432/graft
      DEMO_MODE: "false"
      AUTH_MODE: oidc
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_ALLOWED_HOSTS: ollama
      ANALYSIS_WORKER: external
    networks: [private, edge]
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["private"]
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env.private
        required: true
    environment:
      DATABASE_URL: postgresql://graft:${POSTGRES_PASSWORD:-graft}@db:5432/graft
      DEMO_MODE: "false"
      AUTH_MODE: oidc
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_ALLOWED_HOSTS: ollama
    networks: [private]
    depends_on:
      db:
        condition: service_healthy

networks:
  private:
    internal: true    # no route to the internet: database, model and worker
  edge: {}            # the web app's published port (the app itself also sits on `private`)
  egress: {}          # used only by the one-time model pull

volumes:
  pgdata:
  ollama-models:
