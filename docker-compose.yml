services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dais
      POSTGRES_PASSWORD: dais
      POSTGRES_DB: dais
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dais -d dais"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Local-only database credentials for the compose Postgres container.
      DATABASE_URL: postgresql://dais:dais@db:5432/dais
      AUTH_MODE: demo
      DEMO_MODE: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
