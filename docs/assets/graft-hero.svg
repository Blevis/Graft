<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Graft — evidence-based onboarding readiness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160D35"/>
      <stop offset="0.55" stop-color="#2A1670"/>
      <stop offset="1" stop-color="#5025B8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7954E8"/>
      <stop offset="1" stop-color="#3978F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#3978F6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3978F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- graft mark: two branches joining -->
  <g transform="translate(72 70)">
    <rect width="56" height="56" rx="14" fill="url(#accent)"/>
    <path d="M16 40 C16 28 28 28 28 18 M40 40 C40 28 28 28 28 18" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="28" cy="16" r="4.5" fill="#FFFFFF"/>
    <text x="74" y="38" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Graft</text>
  </g>

  <text x="72" y="196" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">Know who is ready.</text>
  <text x="72" y="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#C9BCF8">Prove it. Act on it.</text>
  <text x="72" y="298" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#E5EEFF">Onboarding &amp; knowledge-transfer readiness for PMOs — every claim cited, every decision human.</text>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="72" y="326" width="148" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#C9BCF8" stroke-opacity="0.5"/>
    <text x="146" y="347" text-anchor="middle" fill="#EFEBFC">Multi-tenant SaaS</text>
    <rect x="232" y="326" width="160" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#C9BCF8" stroke-opacity="0.5"/>
    <text x="312" y="347" text-anchor="middle" fill="#EFEBFC">Private AI (no cloud)</text>
    <rect x="404" y="326" width="150" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#C9BCF8" stroke-opacity="0.5"/>
    <text x="479" y="347" text-anchor="middle" fill="#EFEBFC">Full audit trail</text>
  </g>

  <!-- record card mock -->
  <g transform="translate(830 64)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="380" height="272" rx="18" fill="#FFFFFF"/>
    <text x="24" y="40" font-size="13" fill="#77738A">ONB-005</text>
    <text x="24" y="66" font-size="22" font-weight="700" fill="#191629">Eva Stone</text>
    <rect x="24" y="84" width="104" height="26" rx="13" fill="#E5EEFF"/>
    <text x="76" y="102" font-size="12" text-anchor="middle" font-weight="600" fill="#2454D6">Tracker · 0d</text>
    <rect x="136" y="84" width="120" height="26" rx="13" fill="#EFEBFC"/>
    <text x="196" y="102" font-size="12" text-anchor="middle" font-weight="600" fill="#5025B8">Conflicting</text>
    <rect x="264" y="84" width="92" height="26" rx="13" fill="#F6F5FB" stroke="#E5E2EF"/>
    <text x="310" y="102" font-size="12" text-anchor="middle" font-weight="600" fill="#77738A">Keep open</text>
    <line x1="24" y1="128" x2="356" y2="128" stroke="#E5E2EF"/>
    <rect x="24" y="142" width="4" height="40" rx="2" fill="#7954E8"/>
    <text x="38" y="158" font-size="13" font-weight="600" fill="#191629">Line Manager: “onboarding closed”</text>
    <text x="38" y="177" font-size="12" fill="#77738A">E4 · cited span · verified</text>
    <rect x="24" y="194" width="4" height="40" rx="2" fill="#3978F6"/>
    <text x="38" y="210" font-size="13" font-weight="600" fill="#191629">Tech Lead: “two scenarios uncovered”</text>
    <text x="38" y="229" font-size="12" fill="#77738A">E3 · cited span · verified</text>
    <rect x="24" y="244" width="332" height="2" rx="1" fill="url(#accent)"/>
  </g>
</svg>
